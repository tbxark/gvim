name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before releasing
        run: |
          go vet ./...
          bash tools/purity_check.sh
          bash tools/import_rules_check.sh
          bash tools/i18n_check.sh
          missing="$(go list -f '{{if not .Doc}}{{.ImportPath}}{{end}}' ./...)"
          if [ -n "$missing" ]; then
            echo "Missing package doc comments:"
            echo "$missing"
            exit 1
          fi
          go test -short -p 2 ./...
          go test -race -short -p 2 \
            ./authority/... ./finder/... ./cmd/gvimdebug/... \
            ./internal/app/... ./internal/daemon/... ./internal/tui/... \
            ./internal/lsphost/... ./internal/filewatch/... ./internal/pluginhost/... \
            ./internal/terminal/... ./internal/uitest/... ./lsp/... ./plugin/...

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
