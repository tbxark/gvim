name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pure-Go build
        run: |
          CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: Static checks and package boundaries
        run: |
          go vet ./...
          bash tools/purity_check.sh
          bash tools/import_rules_check.sh
          bash tools/i18n_check.sh
          python3 tools/gen_menus.py --check

      - name: Check Go doc coverage
        run: |
          missing="$(go list -f '{{if not .Doc}}{{.ImportPath}}{{end}}' ./...)"
          if [ -n "$missing" ]; then
            echo "Missing package doc comments:"
            echo "$missing"
            exit 1
          fi

      # The race detector slows the Lua interpreter and the Go paths an order of magnitude,
      # so wall-clock budgets are meaningless here; those tests skip under -short and run in
      # the budgets job below without the race detector. -p 2 matches the runner's cores.
      - name: Run tests with race detector
        run: go test -race -short -p 2 ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  budgets:
    name: Budgets (${{ matrix.os }}, no race)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The wall-clock budget tests (git_gutter/git_blame on big buffers, the vi slices,
      # the plugin timeouts, the editor cost bounds) skip under -short; run the whole suite
      # here without the race detector, where the timings mean what the tests assert.
      - name: Run the suite without the race detector
        run: go test -p 2 ./...
