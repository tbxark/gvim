name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pure-Go build
        run: |
          CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

      - name: Static checks and package boundaries
        run: |
          go vet ./...
          bash tools/purity_check.sh
          bash tools/import_rules_check.sh
          bash tools/i18n_check.sh
          python3 tools/gen_menus.py --check

      - name: Check Go doc coverage
        run: |
          missing="$(go list -f '{{if not .Doc}}{{.ImportPath}}{{end}}' ./...)"
          if [ -n "$missing" ]; then
            echo "Missing package doc comments:"
            echo "$missing"
            exit 1
          fi

      # -short skips the wall-clock budget and memory tests, which are not reliable on a shared
      # runner; nightly.yml runs them. -p 2 matches the runner's cores.
      - name: Run tests
        run: go test -short -p 2 ./...

      # Only the packages that run goroutines gate a pull request under the race detector; the
      # pure-logic packages are covered by the nightly full race run.
      - name: Run concurrent packages with race detector
        run: |
          go test -race -short -p 2 \
            ./internal/app/... ./internal/daemon/... ./internal/tui/... \
            ./internal/lsphost/... ./internal/filewatch/... ./internal/pluginhost/... \
            ./internal/terminal/... ./lsp/... ./plugin/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
